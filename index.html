<style>
/* Layout: poster-style survey. Sticky header with block chips on top, one question per screen in a chunky card, tap an answer and it turns the page itself. Yellow, ink and orange, like the СОТ site. */
:root{
  --bg:#FFD23F; --surface:#FFFFFF; --ink:#15120A; --muted:#4D4720; --bd:#15120A; --sh:#15120A;
  --pick:#FF8A3D; --pick-ink:#15120A; --hot:#FF4F1A; --ok:#1F9D63; --btn:#15120A; --btn-ink:#FFD23F; --soft:#FFF1B8; --danger:#C0210F;
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15120A; --surface:#221D0F; --ink:#FFF3CC; --muted:#CDBF8C; --bd:#F2C94C; --sh:#7A5C0B;
    --pick:#FFB400; --pick-ink:#15120A; --hot:#FF7A3D; --ok:#4BD08B; --btn:#FFD23F; --btn-ink:#15120A; --soft:#2F2711; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15120A; --surface:#221D0F; --ink:#FFF3CC; --muted:#CDBF8C; --bd:#F2C94C; --sh:#7A5C0B;
  --pick:#FFB400; --pick-ink:#15120A; --hot:#FF7A3D; --ok:#4BD08B; --btn:#FFD23F; --btn-ink:#15120A; --soft:#2F2711; --danger:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

/* header */
.top{padding:12px 0 6px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo{flex:none;width:54px;height:54px;overflow:visible}
.bt{min-width:0;flex:1}
.bt h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.2}
.bt p{margin:0;font-size:12.5px;color:var(--muted)}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:2px 3px 6px 1px}
.chip{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"n c" "t t";align-items:center;gap:1px 6px;min-width:0;padding:7px 10px 8px;background:var(--surface);border:2.5px solid var(--bd);border-radius:12px;cursor:pointer;text-align:left;box-shadow:2px 2px 0 var(--sh)}
.chip .n{grid-area:n;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.2}
.chip .c{grid-area:c;justify-self:end;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .t{grid-area:t;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--btn);color:var(--btn-ink)}
.chip.on .c{color:var(--btn-ink)}
.chip.done .n{color:var(--ok)}
.chip.on.done .n{color:var(--btn-ink)}
#banner{margin-top:8px;background:var(--surface);border:2px dashed var(--bd);border-radius:10px;padding:8px 12px;font-size:13px}

/* screens */
main{padding:18px 0 28px;min-height:60vh}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.sticker{display:inline-block;background:var(--hot);color:#fff;border:2.5px solid var(--bd);border-radius:8px;padding:3px 10px;font-family:var(--f-display);font-weight:700;font-size:12px;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--sh)}
:root[data-theme="dark"] .sticker{color:#15120A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sticker{color:#15120A}}
.blk{font-size:13px;font-weight:600;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.dot{width:26px;height:10px;padding:0;border:2px solid var(--bd);border-radius:6px;background:var(--surface);cursor:pointer}
.dot.ok{background:var(--ink)}
.dot.on{background:var(--hot);width:40px}
.card{background:var(--surface);border:2.5px solid var(--bd);border-radius:20px;box-shadow:6px 6px 0 var(--sh);padding:22px 20px}
.card.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(16px) rotate(-.8deg)}to{opacity:1;transform:none}}
.qt{margin:0 0 6px;font-size:clamp(19px,4.6vw,24px);line-height:1.3;font-weight:700;text-wrap:pretty}
.hint{margin:0 0 16px;font-size:13.5px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:2.5px solid var(--bd);border-radius:14px;cursor:pointer;box-shadow:3px 3px 0 var(--sh);transition:transform .12s,box-shadow .12s,background .12s}
.opt:hover{background:var(--soft)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.mark{flex:none;width:34px;height:34px;border:2.5px solid var(--bd);border-radius:9px;display:grid;place-items:center;background:var(--bg);font-family:var(--f-display);font-weight:700;font-size:13px}
.otxt{min-width:0;overflow-wrap:anywhere;padding-top:3px;font-weight:500}
.opt.sel{background:var(--pick);color:var(--pick-ink);transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.opt.sel .mark{background:var(--surface);color:var(--ink)}
.opt.sel .mark b{display:none}
.opt.sel .mark::after{content:"";width:8px;height:15px;border:solid var(--ink);border-width:0 3.5px 3.5px 0;transform:translateY(-2px) rotate(45deg)}
.opt:focus-within{outline:3px solid var(--hot);outline-offset:2px}
.opt.off{opacity:.45;cursor:not-allowed}
.other{margin-top:10px}
input[type=text],input[type=email],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2.5px solid var(--bd);border-radius:12px;padding:12px 14px}
textarea{min-height:150px;resize:vertical}
input[type=text]:focus,input[type=email]:focus,textarea:focus,select:focus{outline:3px solid var(--hot);outline-offset:2px}
.tip{margin-top:12px;font-size:13px;color:var(--muted)}

/* buttons + bottom bar */
.btn{border:2.5px solid var(--bd);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer;min-height:50px;box-shadow:3px 3px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.btn.pri{background:var(--btn);color:var(--btn-ink)}
.btn.big{font-family:var(--f-display);font-size:15px;padding:16px 26px}
.btn.sm{min-height:40px;padding:7px 14px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:wait}
.nav{margin-top:18px;display:flex;gap:10px}
.nav .btn.pri{flex:1}
.nav .back{flex:none;width:56px;padding:0}

/* welcome, block done, final */
.hero h2,.fin h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,6.4vw,38px);line-height:1.12;margin:14px 0 14px;text-wrap:balance}
.hero p,.fin p{max-width:54ch;margin:0 0 14px;font-size:16.5px}
.ticks{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:8px;font-size:16px;max-width:46ch}
.ticks li{position:relative;padding-left:32px;line-height:1.35}
.ticks li::before{content:"";position:absolute;left:0;top:-1px;width:22px;height:22px;border:2.5px solid var(--bd);border-radius:7px;background:var(--pick,#FFB400);box-sizing:border-box}
.ticks li::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:10px;border:solid var(--bd);border-width:0 3px 3px 0;transform:rotate(45deg)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:10px 24px;align-items:center}
.hero-art{justify-self:center;width:100%;max-width:260px}
.honey{width:100%;height:auto;display:block;overflow:visible}
.bee{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero-art{order:-1;max-width:200px}}
.facts{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin:18px 0 22px;padding:0}
.facts li{background:var(--soft);border:2px solid var(--bd);border-radius:12px;padding:8px 14px;font-size:14px}
.facts b{font-family:var(--f-display);font-size:20px;margin-right:4px}
.bigmark{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,16vw,96px);line-height:1;margin:6px 0 0;color:var(--hot);-webkit-text-stroke:2.5px var(--bd);paint-order:stroke fill;text-shadow:5px 5px 0 var(--sh)}
.next-teaser{margin-top:20px;padding:14px 16px;background:var(--soft);border:2px dashed var(--bd);border-radius:12px}
.next-teaser .e{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.next-teaser .t{font-weight:700;margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.actions .pri{margin-left:auto}
.reset-row{display:flex;justify-content:flex-end}
.link{background:none;border:0;padding:6px 2px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;cursor:pointer}
.link[data-arm]{color:var(--danger)}
.time{flex:none;background:var(--surface);border:2.5px solid var(--bd);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--sh);white-space:nowrap;transform:rotate(2deg)}
.err{color:var(--danger)}
.muted{color:var(--muted);font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
#fx i{position:absolute;top:-24px;border:2px solid var(--bd);animation:fall 1.9s cubic-bezier(.25,.6,.45,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}

.pathsvg{display:block;width:100%;max-width:440px;height:auto;margin:10px 0 6px;overflow:visible}
.path{margin-bottom:4px}
.hx-pop,.hx-pulse{transform-box:fill-box;transform-origin:center}
.hx-pop{animation:hxpop .6s cubic-bezier(.2,1.5,.4,1) both}
.hx-pulse{animation:hxpulse 1.4s ease-in-out infinite}
@keyframes hxpop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
@keyframes hxpulse{50%{transform:scale(1.14)}}
.beefly{animation:beefly 1.4s .5s ease-in-out both}
@keyframes beefly{0%{transform:translate(0,0)}50%{transform:translate(36px,-9px)}100%{transform:translate(73px,0)}}
.dl{margin:16px 0 4px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
/* results */
.res-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.big{font-family:var(--f-display);font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.rq{padding:16px 18px;margin-bottom:16px}
.rq h4{margin:0 0 12px;font-size:15px;font-weight:700}
.rq h4 span{color:var(--hot);font-family:var(--f-display);font-size:12px;margin-right:6px}
.rb{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:4px 12px;margin-bottom:10px;font-size:14px}
.rb .t{grid-column:1/-1;overflow-wrap:anywhere}
.rb .tr{height:14px;background:var(--bg);border:2px solid var(--bd);border-radius:999px;overflow:hidden;align-self:center}
.rb .tr i{display:block;height:100%;background:var(--hot)}
.rb .v{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.texts{max-height:260px;overflow:auto;display:grid;gap:8px;border:2px solid var(--bd);border-radius:12px;padding:10px;background:var(--soft)}
.texts p{margin:0;font-size:14px;padding-bottom:8px;border-bottom:1.5px dashed var(--bd);overflow-wrap:anywhere;white-space:pre-wrap}
.texts p:last-child{border:0;padding-bottom:0}
.rh{font-family:var(--f-display);font-weight:700;font-size:18px;margin:26px 0 12px}

@media (max-width:520px){
  .card{padding:18px 14px;box-shadow:5px 5px 0 var(--sh)}
  .chip{padding:6px 8px 7px}
  .chip .t{font-size:11.5px}
  .stepper{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

    body='<select data-t="'+q.id+'" aria-labelledby="t-'+q.id+'"><option value="">Выберите регион</option>'+q.opts.map(function(r){return '<option'+(a===r?" selected":"")+'>'+esc(r)+'</option>';}).join("")+'</select>';
  }else{
    body='<input type="'+(q.type==="email"?"email":"text")+'" data-t="'+q.id+'" aria-labelledby="t-'+q.id+'" value="'+esc(a||"")+'" placeholder="'+(q.type==="email"?"name@example.ru":"Иван Иванович Иванов")+'" autocomplete="'+(q.type==="email"?"email":"name")+'">';
  }
  return body;
}
function drawQ(anim){
  var b=BLOCKS[cur.b],q=curQ();
  var dots=b.qs.map(function(x,i){return '<button type="button" class="dot'+(i===cur.i?" on":(answered(x)?" ok":""))+'" data-dot="'+i+'" aria-label="Вопрос '+(i+1)+' из '+b.qs.length+' в этом блоке"></button>';}).join("");
  var label=q.p?"О вас · "+q.n+" из "+b.qs.length:(b.open?"Своими словами":"Вопрос "+(cur.i+1)+" из "+b.qs.length);
  var head=(cur.i===0)?'<p class="muted" style="margin:0 0 12px"><b>'+esc(b.title)+'</b>'+(b.sub?" "+esc(b.sub):"")+'</p>':"";
  var hint=q.note||HINT[q.type];
  $("main").innerHTML='<div class="meta"><span class="sticker">'+esc(label)+'</span><span class="blk">'+esc(b.short)+'</span></div>'+head+'<div class="dots">'+dots+'</div><article class="card'+(anim&&!reduce()?" pop":"")+'" data-q="'+q.id+'"><h2 class="qt" id="t-'+q.id+'">'+esc(q.t)+'</h2><p class="hint">'+esc(hint)+'</p>'+qBody(q)+'</article>';
  $("main").appendChild(NAVEL);NAVEL.hidden=false;updateNav();
}
function syncCard(q){
  var card=$("main").querySelector(".card");if(!card)return;
  var sel=sels(q),multi=q.type==="multi",full=multi&&sel.length>=q.max,labels=card.querySelectorAll(".opt");
  for(var k=0;k<labels.length;k++){var inp=labels[k].querySelector("input"),v=parseInt(inp.value,10),on=sel.indexOf(v)>-1,off=multi&&full&&!on;
    labels[k].classList.toggle("sel",on);labels[k].classList.toggle("off",off);inp.checked=on;inp.disabled=off;}
  var o=card.querySelector(".other");if(o)o.hidden=sel.indexOf(q.opts.length)<0;
}
function pathSVG(){
  var bi=cur.b,pts=hexPts(22);
  var CH=function(c){return '<path d="M-7 0 L-2 6 L8 -6" style="fill:none;stroke:'+c+';stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round"/>';};
  var s='<svg class="pathsvg" viewBox="-26 -36 292 66" focusable="false" aria-hidden="true">';
  for(var i=0;i<BLOCKS.length;i++){
    var fill="var(--soft)",cls="",inner="",op=.55,dl=0;
    if(i<bi){fill="var(--pick)";cls="hx-pop";inner=CH("var(--bd)");op=1;dl=i*70;}
    else if(i===bi){fill="var(--ok)";cls="hx-pop";inner=CH("var(--surface)");op=1;dl=bi*70+160;}
    else if(i===bi+1){fill="var(--surface)";cls="hx-pulse";op=1;}
    s+='<g transform="translate('+(i*40)+' 0)" opacity="'+op+'"><g class="'+cls+'" style="animation-delay:'+dl+'ms"><polygon transform="translate(2.5 2.5)" points="'+pts+'" style="fill:var(--sh)"/><polygon points="'+pts+'" style="fill:'+fill+';stroke:var(--bd);stroke-width:2.5;stroke-linejoin:round"/>'+inner+'</g></g>';
  }
  s+='<g transform="translate('+(bi*40)+' -22) scale(.55)"><g class="beefly"><ellipse cx="-4" cy="-10" rx="6" ry="9" transform="rotate(-20 -4 -10)" style="fill:var(--surface);stroke:var(--bd);stroke-width:2.5"/><ellipse cx="6" cy="-11" rx="6" ry="9" transform="rotate(15 6 -11)" style="fill:var(--surface);stroke:var(--bd);stroke-width:2.5"/><ellipse cx="0" cy="0" rx="15" ry="10" style="fill:#FFD23F;stroke:var(--bd);stroke-width:2.5"/><path d="M-4 -9 V9 M5 -9.5 V9.5" style="fill:none;stroke:var(--bd);stroke-width:3"/><circle cx="-10" cy="-2" r="1.9" style="fill:var(--bd)"/></g></g>';
  return s+'</svg>';
}
function drawBlockDone(){
  var b=BLOCKS[cur.b],c=blockCount(b),tot=b.qs.length,nb=BLOCKS[cur.b+1];
  $("main").innerHTML='<section class="card fin pop"><span class="sticker">Блок пройден</span><div class="path">'+pathSVG()+'</div><p class="dl">Дальше</p><h2 style="margin-top:0">'+esc(nb.title)+'</h2>'+(nb.sub?'<p class="muted" style="margin:0">'+esc(nb.sub)+'</p>':'')+'<div class="actions"><button type="button" class="btn" id="bk">← Назад</button>'+(c<tot?'<button type="button" class="btn" id="miss">Вернуться к пропущенным</button>':'')+'<button type="button" class="btn pri big" id="cont">Дальше →</button></div></section>';
  $("cont").onclick=function(){cur={b:cur.b+1,i:0};mode="form";render();saveDraft();scrollTop();};
  var m=$("miss");if(m)m.onclick=function(){cur.i=firstOpen(cur.b);mode="form";render();saveDraft();scrollTop();};
  $("bk").onclick=function(){cur.i=BLOCKS[cur.b].qs.length-1;mode="form";render();saveDraft();scrollTop();};
}

/* ---------- navigation ---------- */
function nextQ(){
  clearTimeout(advT);
  var b=BLOCKS[cur.b];
  if(cur.i<b.qs.length-1){cur.i++;drawQ(true);scrollTop();}
  else if(cur.b<BLOCKS.length-1){mode="blockdone";render();confetti();scrollTop();}
  else{mode="send";render();scrollTop();saveDraft();return;}
  saveDraft();
}
function prevQ(){
  clearTimeout(advT);
  if(cur.i>0)cur.i--;else if(cur.b>0){cur.b--;cur.i=BLOCKS[cur.b].qs.length-1;}else return;
  drawStepper();drawQ(true);scrollTop();saveDraft();
}
function openBlock(bi){clearTimeout(advT);cur={b:bi,i:firstOpen(bi)};mode="form";render();saveDraft();scrollTop();}
BACK.addEventListener("click",prevQ);
NEXT.addEventListener("click",nextQ);
$("stepper").addEventListener("click",function(e){var b=e.target.closest("[data-step]");if(!b)return;var v=b.getAttribute("data-step");openBlock(parseInt(v,10));});

/* ---------- answering ---------- */
$("main").addEventListener("click",function(e){
  var d=e.target.closest&&e.target.closest("[data-dot]");
  if(d&&mode==="form"){clearTimeout(advT);cur.i=parseInt(d.getAttribute("data-dot"),10);drawQ(true);saveDraft();}
});
$("main").addEventListener("change",function(e){
  if(mode!=="form")return;
  var t=e.target,q=curQ();
  if(t.matches("input[type=radio],input[type=checkbox]")){
    var v=parseInt(t.value,10),isOther=!!q.other&&v===q.opts.length;
    if(q.type==="one"){A[q.id]=v;if(!isOther)delete A[q.id+"_o"];}
    else{var arr=(A[q.id]||[]).slice(),ix=arr.indexOf(v);
      if(t.checked&&ix<0){if(arr.length>=q.max){t.checked=false;return;}arr.push(v);}
      if(!t.checked&&ix>-1){arr.splice(ix,1);if(isOther)delete A[q.id+"_o"];}
      A[q.id]=arr;}
    syncCard(q);drawStepper();drawProgress();updateNav();saveDraft();
    var o=$("main").querySelector(".other");
    if(isOther&&o&&!o.hidden){o.focus();return;}
    if(q.type==="one"){clearTimeout(advT);var tok=cur.b+":"+cur.i;advT=setTimeout(function(){if(mode==="form"&&cur.b+":"+cur.i===tok)nextQ();},480);}
  }else if(t.matches("select[data-t]")){
    if(t.value)A[q.id]=t.value;else delete A[q.id];
    drawStepper();drawProgress();updateNav();saveDraft();
  }
});
$("main").addEventListener("input",function(e){
  if(mode!=="form")return;
  var t=e.target,q=curQ();
  if(t.hasAttribute("data-t")&&t.tagName!=="SELECT"){
    if(t.value.trim())A[q.id]=t.value;else delete A[q.id];
    drawStepper();drawProgress();updateNav();saveDraft();
  }else if(t.hasAttribute("data-o")){
    if(t.value.trim())A[q.id+"_o"]=t.value;else delete A[q.id+"_o"];saveDraft();
  }
});
document.addEventListener("keydown",function(e){
  if(mode!=="form"||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target&&e.target.tagName,ty=e.target&&e.target.type;
  if(tg==="TEXTAREA"||tg==="SELECT"||(tg==="INPUT"&&ty!=="radio"&&ty!=="checkbox"))return;
  var q=curQ();
  if((q.type==="one"||q.type==="multi")&&/^[1-9]$/.test(e.key)){
    var inp=$("main").querySelector('input[value="'+(parseInt(e.key,10)-1)+'"]');
    if(inp&&!inp.disabled){inp.click();e.preventDefault();}
  }
});

/* ---------- submit ---------- */
function labelOf(q,a,other){
  var opts=q.opts?q.opts.slice():[];if(q.other)opts.push("Другое");
  if(q.type==="one"){return a===undefined?"":(opts[a]||"")+((q.other&&a===q.opts.length&&other)?": "+other:"");}
  if(q.type==="multi"){return (a||[]).map(function(i){return (opts[i]||"")+((q.other&&i===q.opts.length&&other)?": "+other:"");}).join("; ");}
  return a||"";
}
function plainAnswers(){
  var out=["Опрос Форума СОТ — 2026. Мои ответы",""];
  BLOCKS.forEach(function(b){out.push("== "+b.title+" ==");b.qs.forEach(function(q){out.push((q.p?"О вас, "+q.n:q.n)+". "+q.t);out.push("   → "+(labelOf(q,A[q.id],A[q.id+"_o"])||"—"));});out.push("");});
  return out.join("\n");
}
function clientId(){var k="sot2026id",v=null;try{v=localStorage.getItem(k);}catch(e){}if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);try{localStorage.setItem(k,v);}catch(e){}}return v;}
function flatAnswers(){var f={};ALLQ.forEach(function(q){var key=(q.p?"О вас "+q.n:"№"+q.n)+". "+q.t,v=labelOf(q,A[q.id],A[q.id+"_o"]);if(v)f[key]=v;});return f;}
async function submit(btn){
  btn=btn||$("sgo");btn.disabled=true;btn.textContent="Отправляю…";
  var ok=false;
  try{
    if(!CFG.endpoint)throw new Error("no endpoint");
    var res=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({id:clientId(),answers:A,flat:flatAnswers()})});
    var j=await res.json();
    if(!j||!j.ok)throw new Error("bad response");
    try{var s=st();if(s){s.setItem("sot2026bsent","1");s.setItem("sot2026b",JSON.stringify({A:A,cur:cur}));}}catch(e){}
    ok=true;
  }catch(e){ok=false;}
  btn.disabled=false;mode=ok?"done":"fail";render();scrollTop();if(ok)confetti();
}
function drawSend(){
  var n=0;ALLQ.forEach(function(q){if(answered(q))n++;});
  $("main").innerHTML='<section class="card fin pop"><span class="sticker">Последний шаг</span><div class="bigmark">'+n+'/'+ALLQ.length+'</div><h2>Всё готово. Отправляем?</h2><p class="muted">Вы ответили на '+n+' из '+ALLQ.length+' вопросов. Любой блок можно открыть сверху и дополнить.</p><div class="actions"><button type="button" class="btn" id="sback">← Назад</button><button type="button" class="btn pri big" id="sgo">Отправить ответы</button></div></section>';
  $("sback").onclick=function(){cur={b:BLOCKS.length-1,i:BLOCKS[BLOCKS.length-1].qs.length-1};mode="form";render();scrollTop();};
  $("sgo").onclick=function(){submit($("sgo"));};
}
function drawDone(){
  $("main").innerHTML='<section class="card fin pop"><span class="sticker">Готово</span><div class="bigmark">✓</div><h2>Благодарим вас за участие!</h2><p>Ваши ответы помогут улучшить педагогические конкурсы и поддержку образовательных инициатив.</p><div class="actions"><button type="button" class="btn" id="edit">Изменить ответы</button></div></section>';
  $("edit").onclick=function(){try{var s=st();if(s)s.removeItem("sot2026bsent");}catch(e){}cur={b:0,i:0};mode="form";render();saveDraft();scrollTop();};
}
function drawFail(){
  $("main").innerHTML='<section class="card fin pop"><span class="sticker">Не отправлено</span><h2>Не получилось отправить опрос</h2><p>Не удалось связаться с сервером. Ваши ответы не потеряны: попробуйте ещё раз или скопируйте их и перешлите организатору опроса.</p><div class="actions"><button type="button" class="btn pri" id="copy">Скопировать мои ответы</button><button type="button" class="btn" id="retry">Попробовать ещё раз</button><button type="button" class="btn" id="tofrm">К вопросам</button></div><p class="muted" id="cmsg" role="status"></p><textarea id="plain" rows="8" readonly aria-label="Текст ответов"></textarea></section>';
  var ta=$("plain");ta.value=plainAnswers();
  $("copy").onclick=function(){var fin=function(ok){$("cmsg").textContent=ok?"Скопировано. Вставьте текст в сообщение организатору.":"Не удалось скопировать автоматически: выделите текст ниже и скопируйте вручную.";if(!ok){ta.focus();ta.select();}};
    try{navigator.clipboard.writeText(ta.value).then(function(){fin(true);},function(){fin(false);});}catch(e){fin(false);}};
  $("retry").onclick=function(){submit($("retry"));};
  $("tofrm").onclick=function(){cur={b:BLOCKS.length-1,i:BLOCKS[BLOCKS.length-1].qs.length-1};mode="form";render();scrollTop();};
}

/* ---------- restart ---------- */
var resetT=null;
$("reset").addEventListener("click",function(){
  var bt=$("reset");
  if(bt.getAttribute("data-arm")!=="1"){
    bt.setAttribute("data-arm","1");bt.textContent="Сбросить все ответы? Нажмите ещё раз";
    clearTimeout(resetT);resetT=setTimeout(function(){bt.removeAttribute("data-arm");bt.textContent="Начать сначала";},4000);return;
  }
  clearTimeout(resetT);bt.removeAttribute("data-arm");bt.textContent="Начать сначала";
  clearTimeout(advT);clearTimeout(saveT);A={};cur={b:0,i:0};mode="welcome";
  try{var s=st();if(s){s.removeItem("sot2026b");s.removeItem("sot2026bsent");}}catch(e){}
  render();scrollTop();
});

/* ---------- init ---------- */
render();
if(!CFG.endpoint){var bn=$("banner");bn.textContent="Отправка ответов ещё не настроена: в config.js не указан адрес сервера.";bn.hidden=false;}
})();
</script>
</body>
